<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Donkerpaarse achtergrond, zelfde familie als het dashboard -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a2a5e"/>
      <stop offset="100%" stop-color="#1a1230"/>
    </linearGradient>
    <!-- Bliksem loopt van amber naar rood, net als de gevarenlijn -->
    <linearGradient id="bolt" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#ffd66b"/>
      <stop offset="55%" stop-color="#f5b731"/>
      <stop offset="100%" stop-color="#ff5c6c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff5c6c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff5c6c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="86" fill="url(#glow)"/>

  <!-- Drie afstandsringen: de 10 / 25 / 50 km uit de integratie -->
  <g fill="none" stroke="#8a7fd0" stroke-linecap="round">
    <circle cx="128" cy="128" r="94" stroke-opacity="0.28" stroke-width="3"/>
    <circle cx="128" cy="128" r="68" stroke-opacity="0.40" stroke-width="3"/>
    <circle cx="128" cy="128" r="42" stroke-opacity="0.55" stroke-width="3"/>
  </g>

  <!-- Radarveeg vanuit het midden -->
  <path d="M128 128 L62 61 A94 94 0 0 0 34 128 Z" fill="#8a7fd0" fill-opacity="0.22"/>
  <line x1="128" y1="128" x2="62" y2="61" stroke="#a99cf0" stroke-opacity="0.65" stroke-width="3" stroke-linecap="round"/>

  <!-- Bliksemschicht -->
  <path d="M170 46 L116 138 h30 l-16 74 58 -94 h-32 z" fill="url(#bolt)"
        stroke="#1a1230" stroke-width="4" stroke-linejoin="round"/>

  <!-- Positiepunt in het hart van de ringen -->
  <circle cx="128" cy="128" r="7" fill="#1a1230"/>
  <circle cx="128" cy="128" r="4" fill="#ff5c6c"/>
</svg>
